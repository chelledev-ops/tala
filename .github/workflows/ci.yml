name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check every module imports
        run: python -m compileall -q .
      # The live-API tests skip here (no backend configured); the core hashing tests run.
      - run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile --network-timeout 600000
      - run: yarn build
        env:
          REACT_APP_BACKEND_URL: https://example.invalid

  contract:
    name: Contract (tests + WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo test
      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "23.1.4"
        run: |
          set -euo pipefail
          asset="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${asset}" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar
      - run: stellar contract build
      - run: sha256sum target/wasm32v1-none/release/tala_attestation.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: tala-attestation-wasm
          path: contracts/target/wasm32v1-none/release/tala_attestation.wasm
          if-no-files-found: error
